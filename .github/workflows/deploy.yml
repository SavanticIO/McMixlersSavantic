name: Deploy mcmixlers (Blazor Server)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  PROJECT_PATH: "MixlersSavantic.csproj"   # <- set to your .csproj path
  PUBLISH_DIR: "publish"
  REMOTE_DIR: "/var/www/mcmixlers"
  SERVICE_NAME: "mcmixlers"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-mcmixlers
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore (locked)
        run: dotnet restore "${PROJECT_PATH}" --locked-mode

      - name: Publish (Release)
        run: dotnet publish "${PROJECT_PATH}" -c Release -o "${PUBLISH_DIR}"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Compute release path
        id: vars
        run: |
          TS=$(date +'%Y%m%d-%H%M%S')
          echo "timestamp=$TS" >> "$GITHUB_OUTPUT"
          echo "release=${REMOTE_DIR}/releases/${TS}" >> "$GITHUB_OUTPUT"

      - name: Create release dir on server (owned by SSH user)
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
          "sudo mkdir -p '${{ steps.vars.outputs.release }}' '${REMOTE_DIR}/shared/logs' \
           && sudo chown -R ${SSH_USER}:${SSH_USER} '${{ steps.vars.outputs.release }}'"

      - name: Rsync published files to server
        run: |
          rsync -az --delete -e "ssh -p ${SSH_PORT}" \
            "${PUBLISH_DIR}/" \
            "${SSH_USER}@${SSH_HOST}:${{ steps.vars.outputs.release }}/"

      - name: Activate release & restart service
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" bash -lc '
            set -e
            RELEASE="${{ steps.vars.outputs.release }}"
            sudo chown -R www-data:www-data "$RELEASE"
            sudo ln -sfn "$RELEASE" "${{ env.REMOTE_DIR }}/current"
            sudo systemctl restart "${{ env.SERVICE_NAME }}"
            sudo systemctl status "${{ env.SERVICE_NAME }}" --no-pager -l || true
          '

      - name: Prune old releases (keep last 5)
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" bash -lc '
            set -e
            cd "${REMOTE_DIR}/releases" || exit 0
            ls -1tr | head -n -5 | xargs -r sudo rm -rf --
          '
